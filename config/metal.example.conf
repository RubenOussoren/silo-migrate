# Literal KEY=VALUE only: no shell evaluation, quotes, substitutions or inline comments.
# Regular service account, created with /home/NAME and /bin/bash if absent.
SILO_ACCOUNT=silomig
# Private installation root; all managed directories mode 0750.
SILO_PREFIX=/srv/silo-migrate
# Omit to default to SILO_PREFIX/workspaces. A separate disk is supported.
SILO_WORKSPACES=$SILO_PREFIX/workspaces
# HTTPS without embedded credentials, or an absolute local Git repository path.
SILO_REPO=https://github.com/RubenOussoren/silo-migrate.git
SILO_BRANCH=mvp/metal-installer
CONVERTER_REPO=https://github.com/discourse-org/discourse-converters.git
CONVERTER_BRANCH=main
# Synthetic smoke branch, not the production converter default.
VERIFY_CONVERTER_BRANCH=mvp/metal-installer
# Optional allowlisted package directory; empty installs control shell only (not migration-ready).
ARTIFACT_PACKAGE=
# The release pins term-llm (version and checksum); only that version is accepted. 0.9.93, the
# earlier pin, is read as the release's version.
TERM_LLM_VERSION=0.9.99
# Optional reviewed, offline native-node package (manifest/binary/SHA256SUMS).
# Required for this release's locked migration-data tools and DBHub enablement;
# unsupported stock hosts refuse the release update before private-tool activation.
# Never points at customer data. Source/patch identity must match
# runtime/private-node-source.json; see docs/intake-preparation.md.
# The historical attachment package does not satisfy the generic protection gate.
# Package and every ancestor: root/service-account owned, not group/other writable,
# no symlinks; service account must be able to traverse/read them. No permission repair.
# Custom workspace and <prefix>/intake locations are refused. Standalone packaging:
# pass --metal-config /path/to/this.conf so these custom roots are excluded too.
# Selection uses a complete source-identity hash, not just a patch prefix. Existing
# selections are reverified (package, installed bytes, receipts, ELF and CLI probes).
TERM_LLM_PACKAGE=
TERM_LLM_PORT=18800
# install = write service without starting; install-and-start = enable and start; skip = no linger/service.
TERM_LLM_SERVICE=install
# Never replaces an existing Docker installation.
DOCKER_INSTALL=if-missing
PORT_RANGE=18080-18089
# At least two; current and previous are always retained.
KEEP_RELEASES=3
# Available RAM required before `metal verify` starts the synthetic run, in MiB.
# The run's containers are capped at about 7.6 GiB in total but use about 4 GiB.
VERIFY_MIN_AVAILABLE_MIB=8192
# Optional reverse Hub connection (all empty = no Hub). The node dials out to the
# Hub over HTTPS; no inbound port is opened. Install once without these first,
# then create HUB_SECRETS_FILE as the service account (mode 0600) containing
# TERM_LLM_HUB_REGISTRATION_TOKEN=... and re-plan. Never put the token here.
# Anyone with access to that Hub can operate this node with root-equivalent authority.
HUB_URL=
HUB_NODE_ID=
HUB_NODE_NAME=
HUB_SECRETS_FILE=
