<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Runs</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header>
    <h1>Runs</h1>
    <p class="lede">Workflow runs and converter pushes wait here for your decision. Agents can propose; only you approve, start, reset and push.</p>
  </header>
  <main>
    <section id="list-pane" aria-label="Plans, runs and pushes">
      <div class="filters">
        <select id="workspace" aria-label="Project"></select>
        <div><button type="button" class="refresh" id="refresh">Refresh</button></div>
      </div>
      <ol id="items"></ol>
    </section>
    <section id="detail-pane" aria-live="polite">
      <p class="empty">Select a plan, run or push.</p>
    </section>
  </main>
  <div id="toast" role="status"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
