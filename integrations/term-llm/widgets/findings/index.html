<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Findings</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header>
    <h1>Findings</h1>
    <p class="lede">Proposed by migration-data. Only text you release reaches the coding agents.</p>
  </header>
  <main>
    <section id="list-pane" aria-label="Findings">
      <div class="filters">
        <select id="workspace" aria-label="Project"><option value="">All projects</option></select>
        <div class="tabs" role="tablist" aria-label="Status">
          <button type="button" role="tab" data-status="proposed">To review</button>
          <button type="button" role="tab" data-status="released">Released</button>
          <button type="button" role="tab" data-status="rejected">Rejected</button>
          <button type="button" role="tab" data-status="superseded">Replaced</button>
          <button type="button" role="tab" data-status="withdrawn">Withdrawn</button>
          <button type="button" role="tab" data-status="all">All</button>
        </div>
        <input id="search" type="search" placeholder="Search: ID, kind, reviewer or first line" aria-label="Search">
      </div>
      <ol id="items"></ol>
      <div class="pager">
        <button type="button" id="prev">Newer</button>
        <span id="pageinfo"></span>
        <button type="button" id="next">Older</button>
      </div>
    </section>
    <section id="detail-pane" aria-live="polite">
      <p class="empty">Select a finding.</p>
    </section>
  </main>
  <div id="toast" role="status"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
