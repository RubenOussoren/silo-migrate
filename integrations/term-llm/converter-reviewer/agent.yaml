name: converter-reviewer
description: Reviews converter changes before they are pushed (Claude). Read-only; runs tests and lint in the sandbox. Never sees customer data.
provider: claude-bin
# Reviewed version pin: the moving opus alias and older explicit spawn models are refused.
model: claude-opus-5-5
allowed_models:
  - "claude-bin:claude-opus-5-5"
workspace: none
agents_md: "false"
# Web search and read_url, for public documentation.
search: true
max_turns: 60
# Skills from ~/.config/term-llm/skills. Always explicit: an empty selector means every skill.
# none until term-llm can give an agent a subset (count-reconciliation would fit here).
skills: none
tools:
  enabled: [update_plan]
  custom:
    - name: dev_merger_list
      description: "List a directory of the workspace's standalone local merger checkout: files tracked at HEAD (unchanged, or changed by the developer's tools) and files the developer created. Nothing else is ever shown."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 60
      input:
        type: object
        properties:
          path: {type: string, description: "Directory relative to the checkout root; omit for the root"}
        additionalProperties: false
    - name: dev_merger_read
      description: "Read a text file of the standalone local merger checkout from start_line, up to about 32 KB. Use next_line to continue."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 60
      input:
        type: object
        properties:
          path: {type: string}
          start_line: {type: integer, minimum: 1}
        required: [path]
        additionalProperties: false
    - name: dev_merger_search
      description: "Search the same files as dev_list (git grep). Fixed string by default; fixed=false for an extended regex."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 60
      input:
        type: object
        properties:
          pattern: {type: string}
          path: {type: string}
          fixed: {type: boolean}
          ignore_case: {type: boolean}
        required: [pattern]
        additionalProperties: false
    - name: dev_merger_status
      description: "Standalone local merger review path, committed identity and dirty state. No remote or push."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 60
      input:
        type: object
        properties: {}
        additionalProperties: false
    - name: dev_merger_diff
      description: "Diff of visible uncommitted changes (scope working) or one local commit against its parent (scope commit; optional commit SHA). No remote operations."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 60
      input:
        type: object
        properties:
          scope: {type: string, enum: [working, commit]}
          path: {type: string}
          commit: {type: string, pattern: "^[0-9a-f]{40}$"}
        additionalProperties: false
    - name: dev_merger_test
      description: "Run invented test/..._test.rb tests in the pinned image with Ruby/minitest, no network, Bundler or Discourse, and only visible merger files. Stub the stock merger/models. Omit file for all tests."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 300
      input:
        type: object
        properties:
          suite: {type: string, enum: [test]}
          file: {type: string}
        additionalProperties: false
    - name: dev_list
      description: "List a directory of the workspace's converter checkout: files tracked at HEAD (unchanged, or changed by the developer's tools) and files the developer created. Nothing else is ever shown."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 60
      input:
        type: object
        properties:
          path: {type: string, description: "Directory relative to the checkout root; omit for the root"}
        additionalProperties: false
    - name: dev_read
      description: "Read a text file of the converter checkout from start_line, up to about 32 KB. Use next_line to continue."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 60
      input:
        type: object
        properties:
          path: {type: string}
          start_line: {type: integer, minimum: 1}
        required: [path]
        additionalProperties: false
    - name: dev_search
      description: "Search the same files as dev_list (git grep). Fixed string by default; fixed=false for an extended regex."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 60
      input:
        type: object
        properties:
          pattern: {type: string}
          path: {type: string}
          fixed: {type: boolean}
          ignore_case: {type: boolean}
        required: [pattern]
        additionalProperties: false
    - name: dev_status
      description: "Branch, HEAD, uncommitted changes and commits not yet pushed."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 60
      input:
        type: object
        properties: {}
        additionalProperties: false
    - name: dev_diff
      description: "Diff of uncommitted changes (scope working) or of all unpushed commits (scope unpushed); optionally one path."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 60
      input:
        type: object
        properties:
          scope: {type: string, enum: [working, unpushed]}
          path: {type: string}
        additionalProperties: false
    - name: dev_test
      description: "Run the converter's tests (suite test; omit file for the full suite, or one test/..._test.rb file) or lint (suite lint: Rubocop and syntax_tree `stree check`, as GitHub CI runs them; omit file for all, or one Ruby file) in a sandbox: converter image, no network, no customer data. Takes up to a few minutes."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 300
      input:
        type: object
        properties:
          suite: {type: string, enum: [test, lint]}
          file: {type: string}
        additionalProperties: false
    - name: dev_push_show
      description: "Show the latest push proposals for this workspace and their status (proposed, pushed, pull request)."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 60
      input:
        type: object
        properties: {}
        additionalProperties: false
    - name: dev_merge_guide
      description: "Standalone local merger contract, actual Metal review directory, committed layer and exact ready-Prepare Discourse revision with public source links. Works before local repository creation."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 60
      input:
        type: object
        properties: {}
        additionalProperties: false
    - name: dev_findings
      description: "List investigation findings an engineer has released for coding work."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 60
      input:
        type: object
        properties: {}
        additionalProperties: false
    - name: dev_finding_show
      description: "Read one released finding and its synthetic reproduction. Unreleased findings are refused."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 60
      input:
        type: object
        properties:
          finding_id: {type: string}
        required: [finding_id]
        additionalProperties: false
