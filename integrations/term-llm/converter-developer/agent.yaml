name: converter-developer
description: Writes and tests converter code for a migration workspace (Codex). Sees only the converter checkout and released findings, never customer data. Pushes only after engineer approval.
provider: chatgpt
model: gpt-6.1-sol
# Claude is listed only for converter-reviewer: children must pass the parent's model rule
# too. Keep the exact reviewed version in sync with the reviewer's own model and rule.
allowed_models:
  - "chatgpt:*"
  - "claude-bin:claude-opus-5-5"
workspace: none
agents_md: "false"
# Web search and read_url, for public documentation.
search: true
max_turns: 80
# Skills from ~/.config/term-llm/skills. Always explicit: an empty selector means every skill.
skills: none
# It may start converter-reviewer and nothing else: both see only converter code and released
# findings, never customer data. The reviewer can't start agents itself.
spawn:
  allowed_agents: [converter-reviewer]
  # Used when model is omitted; explicit arguments still have to pass both model rules.
  agent_models:
    converter-reviewer: claude-bin:claude-opus-5-5
  max_parallel: 1
  max_depth: 1
  timeout: 1200
tools:
  enabled: [update_plan, spawn_agent, wait_agent]
  custom:
    - name: dev_merger_init
      description: "Create this project's standalone local merger repository with no remote. Does not prepare, reset or run a merge. Customer settings stay outside this checkout."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 70
      input:
        type: object
        properties: {}
        additionalProperties: false
    - name: dev_merger_list
      description: "List a directory of the workspace's standalone local merger checkout: files tracked at HEAD (unchanged, or changed by the developer's tools) and files the developer created. Nothing else is ever shown."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 60
      input:
        type: object
        properties:
          path: {type: string, description: "Directory relative to the checkout root; omit for the root"}
        additionalProperties: false
    - name: dev_merger_read
      description: "Read a text file of the standalone local merger checkout from start_line, up to about 32 KB. Use next_line to continue."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 60
      input:
        type: object
        properties:
          path: {type: string}
          start_line: {type: integer, minimum: 1}
        required: [path]
        additionalProperties: false
    - name: dev_merger_search
      description: "Search the same files as dev_list (git grep). Fixed string by default; fixed=false for an extended regex."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 60
      input:
        type: object
        properties:
          pattern: {type: string}
          path: {type: string}
          fixed: {type: boolean}
          ignore_case: {type: boolean}
        required: [pattern]
        additionalProperties: false
    - name: dev_merger_status
      description: "Standalone local merger review path, committed identity and dirty state. No remote or push."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 60
      input:
        type: object
        properties: {}
        additionalProperties: false
    - name: dev_merger_diff
      description: "Diff of visible uncommitted changes (scope working) or one local commit against its parent (scope commit; optional commit SHA). No remote operations."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 60
      input:
        type: object
        properties:
          scope: {type: string, enum: [working, commit]}
          path: {type: string}
          commit: {type: string, pattern: "^[0-9a-f]{40}$"}
        additionalProperties: false
    - name: dev_merger_test
      description: "Run invented test/..._test.rb tests in the pinned image with Ruby/minitest, no network, Bundler or Discourse, and only visible merger files. Stub the stock merger/models. Omit file for all tests."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 300
      input:
        type: object
        properties:
          suite: {type: string, enum: [test]}
          file: {type: string}
        additionalProperties: false
    - name: dev_merger_write
      description: "Create or replace a file in the standalone local merger checkout (not protected, ignored or Git-internal paths). Returns a diff."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 60
      input:
        type: object
        properties:
          path: {type: string}
          content: {type: string}
        required: [path, content]
        additionalProperties: false
    - name: dev_merger_edit
      description: "Replace exact text in a file of the standalone local merger checkout. old_text must match exactly once unless replace_all. Returns a diff."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 60
      input:
        type: object
        properties:
          path: {type: string}
          old_text: {type: string}
          new_text: {type: string}
          replace_all: {type: boolean}
        required: [path, old_text, new_text]
        additionalProperties: false
    - name: dev_merger_delete
      description: "Delete a file from the standalone local merger checkout."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 60
      input:
        type: object
        properties:
          path: {type: string}
        required: [path]
        additionalProperties: false
    - name: dev_merger_format
      description: "Format visible Ruby files with syntax_tree in the no-network sandbox. No dependency installation. Use path for a Ruby file or folder; otherwise formats visible changed Ruby files."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 300
      input:
        type: object
        properties:
          path: {type: string, description: "A Ruby file or a folder, e.g. helpers"}
        additionalProperties: false
    - name: dev_merger_commit
      description: "Commit visible merger code and invented tests locally as the engineer. No remote, push or PR. The engineer reviews the returned path/commit before any Merge plan."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 60
      input:
        type: object
        properties:
          message: {type: string, description: "Subject line (max 100 chars), blank line, body"}
        required: [message]
        additionalProperties: false
    - name: dev_list
      description: "List a directory of the workspace's converter checkout: files tracked at HEAD (unchanged, or changed by the developer's tools) and files the developer created. Nothing else is ever shown."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 60
      input:
        type: object
        properties:
          path: {type: string, description: "Directory relative to the checkout root; omit for the root"}
        additionalProperties: false
    - name: dev_read
      description: "Read a text file of the converter checkout from start_line, up to about 32 KB. Use next_line to continue."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 60
      input:
        type: object
        properties:
          path: {type: string}
          start_line: {type: integer, minimum: 1}
        required: [path]
        additionalProperties: false
    - name: dev_search
      description: "Search the same files as dev_list (git grep). Fixed string by default; fixed=false for an extended regex."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 60
      input:
        type: object
        properties:
          pattern: {type: string}
          path: {type: string}
          fixed: {type: boolean}
          ignore_case: {type: boolean}
        required: [pattern]
        additionalProperties: false
    - name: dev_status
      description: "Branch, HEAD, uncommitted changes and commits not yet pushed."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 60
      input:
        type: object
        properties: {}
        additionalProperties: false
    - name: dev_diff
      description: "Diff of uncommitted changes (scope working) or of all unpushed commits (scope unpushed); optionally one path."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 60
      input:
        type: object
        properties:
          scope: {type: string, enum: [working, unpushed]}
          path: {type: string}
        additionalProperties: false
    - name: dev_test
      description: "Run the converter's tests (suite test; omit file for the full suite, or one test/..._test.rb file) or lint (suite lint: Rubocop and syntax_tree `stree check`, as GitHub CI runs them; omit file for all, or one Ruby file) in a sandbox: converter image, no network, no customer data. Takes up to a few minutes."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 300
      input:
        type: object
        properties:
          suite: {type: string, enum: [test, lint]}
          file: {type: string}
        additionalProperties: false
    - name: dev_push_show
      description: "Show the latest push proposals for this workspace and their status (proposed, pushed, pull request)."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 60
      input:
        type: object
        properties: {}
        additionalProperties: false
    - name: dev_merge_guide
      description: "Standalone local merger contract, actual Metal review directory, committed layer and exact ready-Prepare Discourse revision with public source links. Works before local repository creation."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 60
      input:
        type: object
        properties: {}
        additionalProperties: false
    - name: dev_findings
      description: "List investigation findings an engineer has released for coding work."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 60
      input:
        type: object
        properties: {}
        additionalProperties: false
    - name: dev_finding_show
      description: "Read one released finding and its synthetic reproduction. Unreleased findings are refused."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 60
      input:
        type: object
        properties:
          finding_id: {type: string}
        required: [finding_id]
        additionalProperties: false
    - name: dev_write
      description: "Create or replace a file in the converter checkout (not protected, ignored or Git-internal paths). Returns a diff."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 60
      input:
        type: object
        properties:
          path: {type: string}
          content: {type: string}
        required: [path, content]
        additionalProperties: false
    - name: dev_edit
      description: "Replace exact text in a file of the converter checkout. old_text must match exactly once unless replace_all. Returns a diff."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 60
      input:
        type: object
        properties:
          path: {type: string}
          old_text: {type: string}
          new_text: {type: string}
          replace_all: {type: boolean}
        required: [path, old_text, new_text]
        additionalProperties: false
    - name: dev_delete
      description: "Delete a file from the converter checkout."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 60
      input:
        type: object
        properties:
          path: {type: string}
        required: [path]
        additionalProperties: false
    - name: dev_branch_resolve
      description: "Resolve a private converter repository URL or PR number without web tools: pull, tree, blob, compare or commit. Returns branch/path/lines/base/sha as applicable; pass sha as branch when there is no branch head. Shares the branches fetch throttle."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 90
      input:
        type: object
        properties:
          link: {type: string, maxLength: 2048, description: "Full github.com URL for this workspace's origin, or a PR number as a string"}
        required: [link]
        additionalProperties: false
    - name: dev_branches
      description: "List the converter's branches on GitHub, newest first, with how far each is ahead of and behind main (and the pull request, when this project opened it). Fetches from GitHub first (at most once a minute). Read-only: use it to find another migration's branch or a pull request's branch, such as one the engineer names."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 90
      input:
        type: object
        properties:
          fetch: {type: boolean, description: "false to skip fetching (default true)"}
        additionalProperties: false
    - name: dev_branch_diff
      description: "A branch on GitHub compared with main (or base), as its pull request shows it: its commits, the diff stat and the diff. Read-only; nothing in your checkout changes."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 60
      input:
        type: object
        properties:
          branch: {type: string, description: "Origin branch name, e.g. migration/arc/mybb-staged-activation, or a downloaded SHA returned by the resolver"}
          base: {type: string, description: "Branch to compare with (default main)"}
          path: {type: string, description: "One file or directory, when the diff is truncated"}
        required: [branch]
        additionalProperties: false
    - name: dev_branch_read
      description: "Read one file as it is on a branch on GitHub (not your checkout). Read-only."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 60
      input:
        type: object
        properties:
          branch: {type: string, description: "Origin branch name or a downloaded SHA returned by the resolver"}
          path: {type: string, description: "Relative to the repository root"}
          start_line: {type: integer, minimum: 1}
        required: [branch, path]
        additionalProperties: false
    - name: dev_branch
      description: "Switch to (or, for a project's first change, create) the branch migration/<workspace>/<topic>. One branch per project: creating a second one is refused (STANDARD_DEV_ONE_BRANCH) unless new_pr is true because the engineer asked for a separate PR. Uncommitted changes come along."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 60
      input:
        type: object
        properties:
          topic: {type: string, description: "Lowercase, e.g. mybb-converter"}
          new_pr: {type: boolean, description: "Only when the engineer asked for a separate pull request"}
        required: [topic]
        additionalProperties: false
    - name: dev_format
      description: "Format Ruby files with syntax_tree and the repository's .streerc (what GitHub CI checks), in the sandbox, and write the result back like dev_write. path: a file or folder; omit it for your uncommitted Ruby files. Takes up to a few minutes."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 300
      input:
        type: object
        properties:
          path: {type: string, description: "A Ruby file or a folder, e.g. converters/mybb"}
        additionalProperties: false
    - name: dev_commit
      description: "Commit all visible changes on the current migration branch, built from their verified content, authored as the engineer, with an Assisted-by trailer. Nothing else in the checkout is committed."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 60
      input:
        type: object
        properties:
          message: {type: string, description: "Subject line (max 100 chars), blank line, body"}
        required: [message]
        additionalProperties: false
    - name: dev_rebase_main
      description: "Rebase this project's migration branch onto a freshly fetched origin/main, locally only. Checkpoint your own uncommitted changes with dev_commit first; never stash customer files. A disposable Git replay leaves the live branch unchanged on conflicts. Nothing is pushed. Re-run tests and review, then dev_push_propose: a rewritten published branch requires the engineer's explicit lease-protected push approval."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 300
      input:
        type: object
        properties: {}
        additionalProperties: false
    - name: dev_push_propose
      description: "Propose pushing the current migration branch and opening a draft pull request. Nothing is pushed: the engineer approves the returned digest with a command."
      script: scripts/dev_tool.py
      call: json
      timeout_seconds: 60
      input:
        type: object
        properties:
          title: {type: string}
          body: {type: string}
          base: {type: string, description: "Base branch, default main"}
          findings: {type: array, items: {type: string}, description: "IDs of the released findings this push addresses (from dev_findings). Name every one it fixes; leave it out for pushes that aren't about a finding, such as tidying or tests"}
        required: [title]
        additionalProperties: false
